[project]
name = "clasificador-api"
version = "0.0.1"
description = "Clasificador de documentos hipotecarios chilenos (FastAPI + langextract)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-decouple>=3.8",
    "google-cloud-storage>=2.18.0",
    "google-cloud-logging>=3.11.0",
    "langextract>=1.0.0",
    "asyncpg>=0.30.0",
    "sqlalchemy>=2.0.0",
    "python-multipart>=0.0.10",
    "httpx>=0.27.0",
    "PyPDF2>=3.0.0",
    "pdfplumber>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
