name: deploy-dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud builds submit . --config=cloudbuild-staging.yaml --project=${{ secrets.GCP_PROJECT }} --substitutions=_GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
      - id: url
        run: |
          URL=$(gcloud run services describe clasificador-api-dev --region=southamerica-west1 --project=${{ secrets.GCP_PROJECT }} --format='value(status.url)')
          echo "service_url=$URL" >> $GITHUB_OUTPUT
          echo "::notice title=Deployed::clasificador-api-dev -> $URL"
      - name: Smoke test
        run: |
          set -e
          STATUS=$(curl -s -o /tmp/h.json -w "%{http_code}" "${{ steps.url.outputs.service_url }}/health")
          echo "HTTP $STATUS"; cat /tmp/h.json
          [ "$STATUS" = "200" ]
