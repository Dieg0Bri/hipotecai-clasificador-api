# Cloud Build · clasificador-api · staging
steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest', '.']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push'
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=clasificador-api-sa@${PROJECT_ID}.iam.gserviceaccount.com'
      - '--add-cloudsql-instances=${PROJECT_ID}:${_DB_REGION}:${_DB_INSTANCE_NAME}'
      - '--set-env-vars=^@^NODE_ENV=staging@GOOGLE_CLOUD_PROJECT=${PROJECT_ID}@DB_USER=${_DB_USER}@DB_NAME=${_DB_NAME}@DB_PORT=${_DB_PORT}@INSTANCE_CONNECTION_NAME=${PROJECT_ID}:${_DB_REGION}:${_DB_INSTANCE_NAME}@GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}@ALLOWED_ORIGINS=${_ALLOWED_ORIGINS}@GCS_BUCKET_DOCUMENTOS=${_GCS_BUCKET_DOCUMENTOS}@GEMINI_MODEL_ID=${_GEMINI_MODEL_ID}@LANGEXTRACT_TEMPERATURE=0.1'
      - '--update-secrets=DB_PASSWORD=${_DB_PASSWORD_SECRET}:latest,GEMINI_API_KEY=${_GEMINI_API_KEY_SECRET}:latest'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=300'
      - '--concurrency=20'
      - '--max-instances=10'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest'

serviceAccount: 'projects/${PROJECT_ID}/serviceAccounts/cloudbuild-deployer-sa@${PROJECT_ID}.iam.gserviceaccount.com'

options:
  logging: CLOUD_LOGGING_ONLY
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

substitutions:
  _SERVICE_NAME: 'clasificador-api-dev'
  _REPO_NAME: 'hipotecai-services'
  _REGION: 'southamerica-west1'
  _DB_REGION: 'southamerica-west1'
  _DB_INSTANCE_NAME: 'hipotecai-pg'
  _DB_USER: 'postgres'
  _DB_NAME: 'hipotecai_dev'
  _DB_PORT: '5432'
  _DB_PASSWORD_SECRET: 'db-password'
  _GEMINI_API_KEY_SECRET: 'gemini-api-key'
  _GEMINI_MODEL_ID: 'gemini-2.5-flash'
  _GOOGLE_CLIENT_ID: ''
  _ALLOWED_ORIGINS: 'https://frontend-dev-thsmcpbjwa-tl.a.run.app,http://localhost:3030'
  _GCS_BUCKET_DOCUMENTOS: 'hipotecai-documentos-dev'
